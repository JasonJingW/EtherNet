
#
# Chip and RTOS memory
#

#
# STM32F767IGT6: Flash 1 MiB; system RAM 512 KiB
#

#
# SRAM1 368 KiB + SRAM2 16 KiB + DTCM 128 KiB
#

#
# Physical capacities are fixed; linker placement is configured separately
#
CONFIG_CHIP_FLASH_SIZE_BYTES=1048576
CONFIG_CHIP_SRAM1_SIZE_BYTES=376832
CONFIG_CHIP_SRAM2_SIZE_BYTES=16384
CONFIG_CHIP_DTCM_SIZE_BYTES=131072
CONFIG_CHIP_ITCM_SIZE_BYTES=16384
CONFIG_CHIP_BACKUP_SRAM_SIZE_BYTES=4096
CONFIG_RTOS_TOTAL_HEAP_SIZE=32768
CONFIG_RTOS_MINIMAL_STACK_SIZE=128
CONFIG_RTOS_MAX_PRIORITIES=8
CONFIG_RTOS_MAX_TASK_NAME_LEN=16
CONFIG_RTOS_TIMER_TASK_STACK_DEPTH=256
CONFIG_RTOS_TIMER_QUEUE_LENGTH=10
CONFIG_RTOS_TIMER_TASK_PRIORITY=2
# end of Chip and RTOS memory

#
# Operating system
#

#
# FreeRTOS heap_4, dynamic allocation; shared HAL/RTOS tick fixed at 1000 Hz
#
CONFIG_RTOS_USE_TIMERS=y
CONFIG_RTOS_MAX_SYSCALL_INTERRUPT_PRIORITY=5
# end of Operating system

#
# Tasks
#

#
# Heartbeat task
#
CONFIG_HEARTBEAT_ENABLED=y
CONFIG_HEARTBEAT_TASK_PRIORITY=1
CONFIG_HEARTBEAT_TASK_NAME="heartbeat"
CONFIG_HEARTBEAT_TASK_STACK_DEPTH=512
CONFIG_HEARTBEAT_TASK_PERIOD_MS=50
CONFIG_HEARTBEAT_TASK_START_DELAY_MS=0
# end of Heartbeat task
# end of Tasks

#
# RTT logging
#
CONFIG_RTT_LOG_LEVEL=3
CONFIG_RTT_LOG_COLOR=y
# end of RTT logging
